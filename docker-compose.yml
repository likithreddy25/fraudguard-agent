# Real, single-node Apache Kafka in KRaft mode (no Zookeeper needed) using
# the official Apache Kafka image. Run on your own machine (needs Docker +
# internet, neither of which the sandbox this project was first built in
# has -- verified directly, see docs/PHASE1.md):
#
#   docker compose up -d
#   pip install -r requirements.txt
#   python -m src.producer.event_generator --events-per-sec 20 &
#   python -m src.consumer.scorer
#
# Then check data/monitoring.db (sqlite3 data/monitoring.db
# "select count(*), avg(flagged) from scored_events;") for real, live
# results and paste them back if you want the numbers documented.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: fraudguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
